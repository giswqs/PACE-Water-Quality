name: Daily PACE products

# Downloads every PACE OCI L2 AOP pass from the most recent available date,
# runs MoE-VAE inference, and publishes the resulting Cloud Optimized
# GeoTIFFs and per-date JSON catalogs to the Hugging Face dataset. Runs every
# day and can also be triggered manually.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read # products are published to Hugging Face, not to git

concurrency:
  group: daily-pace
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch (avoids the large CUDA wheels on the runner).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Download every pass from the latest available date
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: python download_latest.py

      - name: Process the scenes
        run: python run_folder.py --json-dir json

      - name: List products
        run: |
          find output -name '*.tif' | sort
          ls -lh json/

      - name: Publish COGs and JSON catalogs to the Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          repo_id = "giswqs/PACE-Water-Quality"
          api = HfApi(token=os.environ["HF_TOKEN"])
          api.create_repo(repo_id, repo_type="dataset", exist_ok=True)
          # COGs go to data/<product>/<granule>.tif, catalogs to json/.
          api.upload_folder(
              folder_path="output",
              path_in_repo="data",
              repo_id=repo_id,
              repo_type="dataset",
              allow_patterns=["*.tif"],
              commit_message="Add daily PACE water-quality products",
          )
          api.upload_folder(
              folder_path="json",
              path_in_repo="json",
              repo_id=repo_id,
              repo_type="dataset",
              allow_patterns=["*.json"],
              commit_message="Update per-date PACE catalogs",
          )
          print("Uploaded to", f"https://huggingface.co/datasets/{repo_id}")
          PY
